name: Scheduled background jobs

# The "background workers" this project has — see docs/deployment.md
# #background-workers. No message queue exists yet (see each CLI module's
# own docstring: "no scheduler exists in this environment yet"); this
# workflow *is* the scheduler, running each job periodically against
# whichever environment its own job targets. Every job is independently
# idempotent (see docs/performance-and-reliability.md#idempotent-tasks),
# so an overlapping run or a skipped run is never destructive.
on:
  schedule:
    - cron: "*/5 * * * *" # ai jobs — short-latency, user-facing
    - cron: "0 * * * *" # payment reconciliation — hourly
    - cron: "0 3 * * *" # subscription expiration — daily, off-peak
    - cron: "0 4 * * *" # account deletion finalization — daily, off-peak
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        type: choice
        options: [ai_jobs, reconcile_payments, process_subscriptions, process_account_deletions]

permissions:
  contents: read

jobs:
  run:
    name: Run scheduled job (production)
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
      SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PRODUCTION_SUPABASE_SERVICE_ROLE_KEY }}
      RAZORPAY_KEY_ID: ${{ secrets.PRODUCTION_RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.PRODUCTION_RAZORPAY_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"

      - name: AI jobs (every 5 minutes)
        if: github.event.schedule == '*/5 * * * *' || github.event.inputs.job == 'ai_jobs'
        run: python -m app.cli.process_ai_jobs

      - name: Payment reconciliation (hourly)
        if: github.event.schedule == '0 * * * *' || github.event.inputs.job == 'reconcile_payments'
        run: python -m app.cli.reconcile_payments

      - name: Subscription expiration (daily)
        if: github.event.schedule == '0 3 * * *' || github.event.inputs.job == 'process_subscriptions'
        run: python -m app.cli.process_subscriptions

      - name: Account deletion finalization (daily)
        if: github.event.schedule == '0 4 * * *' || github.event.inputs.job == 'process_account_deletions'
        run: python -m app.cli.process_account_deletions
